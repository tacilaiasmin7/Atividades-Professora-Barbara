<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Portal do Aluno</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:black;
height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

.card{

background:black;
width: 325px;;
padding:40px;
border-radius:20px;
box-shadow:0 15px 30px rgba(0,0,0,.3);
text-align:center;  

}

h1{

color:white;
margin-bottom:10px;
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif

}


input{

width:100%;
background-color: rgba(128, 128, 128, 0.3); 
padding:14px;
margin:10px 0;
border-radius:8px;
border:1px solid rgba(128, 128, 128, 0.3);
font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif

}

input::placeholder {
  color: white;

}
button{

width:100%;
padding:15px;
margin-top:20px;
border:1px solid #D3D3D3;
border-radius:10px;
background:black;
color:white;
cursor:pointer;
transition:.3s;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

}

h5{
    text-align: left;
    color:white;
    font-size: 10px;
}


</style>

</head>

<body>

<div class="card">

<h1>Nome do produto</h1>

<h5>NOME</h5>
<input type="text" id="nome" required placeholder="Nome"><br><br>

<h5>EMAIL</h5>
<input type="text" id="email" required placeholder="Email"><br><br>

<h5>SENHA</h5>
<input type="password" id="senha" required placeholder="Senha"><br><br>

<button onclick="login()">Entrar</button>


</body>

</html>
