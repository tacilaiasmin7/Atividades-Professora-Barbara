<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eletromidia</title>
    
   <style> * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background-image: url('fundo2.jpg.jpeg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.login-box {
    background: rgba(78, 8, 136, 0.623);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

h1 {
    text-align: center;
    color: #ffffff;
    margin-bottom: 20px;
}

.subtitulo {
    text-align: center;
    color: #ffffff;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-bottom: 7px;
    color: #ffffff;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-bottom: 20px;

    border: 1px solid #ccc;
    border-radius: 8px;

    font-size: 15px;
    outline: none;
}

input:focus {
    border-color: #2563eb;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 20px;

    background: #ffffff;
    color: rgb(0, 0, 0);

    border: none;
    border-radius: 8px;

    font-size: 16px;
    font-weight: bold;

    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #fbfcff;
}

#mensagem {
    text-align: center;
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

    <div class="container">

    <div class="login-box"> 

            <h1>Eletromidia</h1>
        
            <form id="loginForm">

                <label for="nome">Nome:</label>
                <input type="text"id="nome"placeholder="Digite seu nome completo">

                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="Digite seu e-mail">

                <label for="senha">Senha:</label>
                <input type="password" id="senha" placeholder="Digite sua senha">

                <button type="submit">ENTRAR</button>
                
            </form>

            </div>

                <script src="login.js"></script>
        
        

    </div>

    
    

</body>
</html>
